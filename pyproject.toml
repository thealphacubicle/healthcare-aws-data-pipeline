[project]
name = "healthcare-aws-data-pipeline"
version = "0.1.0"
description = "An AWS data pipeline for healthcare-related data."
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "boto3>=1.35",
    "botocore>=1.35",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_pipeline"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]
# Bundled into the ingestion Lambda zip (see scripts/build_lambdas.py).
ingest = [
    "google-auth>=2.30",
    "requests>=2.32",
]
# Installed on the EC2 dashboard host only.
app = [
    "streamlit>=1.40",
]

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]