[project]
name = "healthcare-aws-data-pipeline"
version = "0.1.0"
description = "An AWS data pipeline for healthcare-related data."
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "boto3>=1.35",
    "botocore>=1.35",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]